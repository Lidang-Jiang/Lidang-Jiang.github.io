name: Update Google Scholar Citations

on:
  schedule:
    - cron: '0 1 * * 1' # 每周一北京时间 09:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 测试 Google Scholar 解析与缓存恢复
        run: node --test scripts/fetch-citations.test.mjs

      - name: 更新 Google Scholar 被引用次数
        run: node scripts/fetch-citations.mjs

      - name: 仅提交引用数据并安全同步
        id: commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- src/data/citation-counts.json
          if git diff --cached --quiet -- src/data/citation-counts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Google Scholar citation counts" -- src/data/citation-counts.json
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit
